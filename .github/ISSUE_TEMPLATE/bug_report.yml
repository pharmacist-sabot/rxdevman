name: Bug report
description: Report a bug in RxDev Man
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      description: Which page shows the problem? (e.g. https://rxdevman.com/blog/...)
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where did you see this?
      options:
        - Online (rxdevman.com)
        - Local dev server
        - Offline / PWA
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can the problem be reproduced?
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Browser, OS, theme (light/dark/sepia), screenshots, console errors.
